<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slope64</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f4f5f4;
    --surface: #ffffff;
    --border: #dde0dd;
    --primary: #2c5f2e;
    --accent: #6aaa6d;
    --text: #1a2b1a;
    --muted: #6b7c6b;
    --danger: #c0392b;
    --mono: 'JetBrains Mono', 'Fira Mono', monospace;
  }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 16px;
  }
  .container { max-width: 860px; margin: 0 auto; }

  header { margin-bottom: 32px; }
  header h1 { font-size: 22px; font-weight: 700; color: var(--primary); }
  header p { font-size: 14px; color: var(--muted); margin-top: 4px; }
  header a { color: var(--accent); text-decoration: none; }
  header a:hover { text-decoration: underline; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: var(--primary); }

  .tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
  .tab {
    padding: 8px 18px; font-size: 14px; cursor: pointer; border: none;
    background: none; color: var(--muted); font-weight: 500;
    border-bottom: 2px solid transparent; margin-bottom: -2px;
  }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  label { font-size: 13px; font-weight: 500; display: block; margin-bottom: 6px; }

  select, input[type=file] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 14px; background: var(--bg);
    color: var(--text); outline: none;
  }
  select:focus, input[type=file]:focus { border-color: var(--accent); }

  .drop-zone {
    border: 2px dashed var(--border); border-radius: 8px;
    padding: 32px; text-align: center; cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    font-size: 14px; color: var(--muted);
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent); background: #f0faf0;
  }
  .drop-zone .filename { margin-top: 8px; font-weight: 600; color: var(--primary); font-size: 13px; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 24px; border: none; border-radius: 6px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    background: var(--primary); color: #fff; margin-top: 16px;
    transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.88; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn .spinner {
    width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.6s linear infinite; display: none;
  }
  .btn.loading .spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Results */
  #results { display: none; }

  .fos-display {
    text-align: center; padding: 28px;
    border-bottom: 1px solid var(--border); margin-bottom: 24px;
  }
  .fos-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .fos-value { font-size: 56px; font-weight: 700; line-height: 1.1; margin-top: 4px; }
  .fos-value.safe { color: var(--primary); }
  .fos-value.marginal { color: #e67e22; }
  .fos-value.unsafe { color: var(--danger); }
  .fos-interp { font-size: 13px; color: var(--muted); margin-top: 6px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 12px; font-size: 11px; text-transform: uppercase;
       letter-spacing: 0.06em; color: var(--muted); border-bottom: 2px solid var(--border); }
  td { padding: 8px 12px; border-bottom: 1px solid var(--border); font-family: var(--mono); }
  tr:last-child td { border-bottom: none; }
  tr.converged td { color: var(--primary); }
  tr.failed td { color: var(--muted); }

  .res-toggle {
    font-size: 13px; color: var(--accent); cursor: pointer;
    border: none; background: none; padding: 0; margin-top: 16px;
    display: block;
  }
  pre {
    background: #f8faf8; border: 1px solid var(--border);
    border-radius: 6px; padding: 16px; font-family: var(--mono);
    font-size: 12px; line-height: 1.6; overflow-x: auto; margin-top: 8px;
    white-space: pre-wrap; display: none;
  }
  pre.visible { display: block; }

  .error {
    background: #fdf0ef; border: 1px solid #f5c6c2; border-radius: 6px;
    padding: 14px 16px; font-size: 13px; color: var(--danger); display: none;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Slope64</h1>
    <p>FEM slope stability analysis — <a href="https://inside.mines.edu/~vgriffit/" target="_blank">D.V. Griffiths</a>, Colorado School of Mines</p>
  </header>

  <div class="card">
    <div class="tabs">
      <button class="tab active" data-tab="example">Run example</button>
      <button class="tab" data-tab="upload">Upload .dat file</button>
    </div>

    <!-- Example tab -->
    <div class="tab-panel active" id="tab-example">
      <label for="example-select">Select example</label>
      <select id="example-select">
        <option value="">Loading examples…</option>
      </select>
      <button class="btn" id="run-example-btn">
        <span class="spinner"></span>
        Run analysis
      </button>
    </div>

    <!-- Upload tab -->
    <div class="tab-panel" id="tab-upload">
      <label>Upload .dat file</label>
      <div class="drop-zone" id="drop-zone">
        <div>Drop a .dat file here, or click to browse</div>
        <div class="filename" id="filename-display"></div>
        <input type="file" id="file-input" accept=".dat" style="display:none">
      </div>
      <button class="btn" id="run-upload-btn" disabled>
        <span class="spinner"></span>
        Run analysis
      </button>
    </div>
  </div>

  <div class="error" id="error-box"></div>

  <div class="card" id="results">
    <div class="fos-display">
      <div class="fos-label">Estimated Factor of Safety</div>
      <div class="fos-value" id="fos-value">—</div>
      <div class="fos-interp" id="fos-interp"></div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Trial SRF</th>
          <th>Max displacement</th>
          <th>Iterations</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="srf-table"></tbody>
    </table>

    <button class="res-toggle" id="res-toggle">Show full output</button>
    <pre id="res-output"></pre>
  </div>
</div>

<script>
const API = '';

// Load examples
fetch(`${API}/examples`)
  .then(r => r.json())
  .then(examples => {
    const sel = document.getElementById('example-select');
    sel.innerHTML = examples.map(e =>
      `<option value="${e}">${e}</option>`
    ).join('');
  });

// Tab switching
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
  });
});

// Drop zone
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const filenameDisplay = document.getElementById('filename-display');
const runUploadBtn = document.getElementById('run-upload-btn');
let selectedFile = null;

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file) setFile(file);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) setFile(fileInput.files[0]);
});

function setFile(file) {
  selectedFile = file;
  filenameDisplay.textContent = file.name;
  runUploadBtn.disabled = false;
}

// Run example
document.getElementById('run-example-btn').addEventListener('click', async () => {
  const example = document.getElementById('example-select').value;
  if (!example) return;
  const btn = document.getElementById('run-example-btn');
  await runAnalysis(() => fetch(`${API}/run/${example}`, { method: 'POST' }), btn);
});

// Run upload
runUploadBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  const formData = new FormData();
  formData.append('file', selectedFile);
  await runAnalysis(() => fetch(`${API}/run`, { method: 'POST', body: formData }), runUploadBtn);
});

async function runAnalysis(fetchFn, btn) {
  btn.classList.add('loading');
  btn.disabled = true;
  document.getElementById('error-box').style.display = 'none';
  document.getElementById('results').style.display = 'none';

  try {
    const resp = await fetchFn();
    const data = await resp.json();

    if (!resp.ok) {
      showError(data.detail || 'Unknown error');
      return;
    }

    showResults(data);
  } catch (err) {
    showError(err.message);
  } finally {
    btn.classList.remove('loading');
    btn.disabled = false;
  }
}

function showResults(data) {
  const fos = data.fos;
  const fosEl = document.getElementById('fos-value');
  fosEl.textContent = fos != null ? fos.toFixed(3) : 'N/A';
  fosEl.className = 'fos-value ' + (fos == null ? '' : fos >= 1.5 ? 'safe' : fos >= 1.2 ? 'marginal' : 'unsafe');

  const interp = document.getElementById('fos-interp');
  if (fos == null) {
    interp.textContent = 'Analysis did not converge';
  } else if (fos >= 1.5) {
    interp.textContent = 'Stable (FoS ≥ 1.5)';
  } else if (fos >= 1.2) {
    interp.textContent = 'Marginal stability (1.2 ≤ FoS < 1.5)';
  } else {
    interp.textContent = 'Unstable (FoS < 1.2)';
  }

  const tbody = document.getElementById('srf-table');
  tbody.innerHTML = (data.srf_steps || []).map(row => {
    const converged = row.iterations < 1000;
    return `<tr class="${converged ? 'converged' : 'failed'}">
      <td>${row.srf.toFixed(4)}</td>
      <td>${row.max_disp.toExponential(3)}</td>
      <td>${row.iterations}</td>
      <td>${converged ? '✓ converged' : '✗ did not converge'}</td>
    </tr>`;
  }).join('');

  const resOut = document.getElementById('res-output');
  resOut.textContent = data.res || '';
  resOut.classList.remove('visible');
  document.getElementById('res-toggle').textContent = 'Show full output';

  document.getElementById('results').style.display = 'block';
  document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function showError(msg) {
  const el = document.getElementById('error-box');
  el.textContent = msg;
  el.style.display = 'block';
}

document.getElementById('res-toggle').addEventListener('click', () => {
  const pre = document.getElementById('res-output');
  const btn = document.getElementById('res-toggle');
  pre.classList.toggle('visible');
  btn.textContent = pre.classList.contains('visible') ? 'Hide full output' : 'Show full output';
});
</script>
</body>
</html>
